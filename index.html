<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>KPSS Koçu</title>

<meta name="description" content="KPSS hata defteri ve aralıklı tekrar sistemi. Çevrimdışı çalışır.">
<meta name="theme-color" content="#1B2431">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikon/ikon-192.png">

<!-- iOS ana ekran desteği -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPSS Koçu">
<link rel="apple-touch-icon" href="ikon/ikon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="uygulama">
  <header class="ust-bar">
    <div>
      <div class="marka-ad">KPSS KOÇU</div>
      <div class="marka-alt" id="baslikAlt">Bugün</div>
    </div>
  </header>

  <main id="govde"></main>

  <nav class="alt-bar">
    <button class="alt-oge aktif" data-sekme="bugun"   onclick="sekmeGec('bugun')">
      <span class="alt-simge">◉</span><span class="alt-yazi">Bugün</span></button>
    <button class="alt-oge" data-sekme="tekrar"  onclick="sekmeGec('tekrar')">
      <span class="alt-simge">⟳</span><span class="alt-yazi">Tekrar</span></button>
    <button class="alt-oge" data-sekme="hata"    onclick="sekmeGec('hata')">
      <span class="alt-simge">✎</span><span class="alt-yazi">Defter</span></button>
    <button class="alt-oge" data-sekme="konular" onclick="sekmeGec('konular')">
      <span class="alt-simge">▦</span><span class="alt-yazi">Konular</span></button>
    <button class="alt-oge" data-sekme="ayarlar" onclick="sekmeGec('ayarlar')">
      <span class="alt-simge">⚙</span><span class="alt-yazi">Ayarlar</span></button>
  </nav>
</div>

<script src="js/kartlar.js"></script>
<script src="js/leitner.js"></script>
<script src="js/depo.js"></script>
<script src="js/app.js"></script>
<script>
  /* Servis çalışanı: dosyaları telefona kaydeder, uygulama internetsiz açılır. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Servis çalışanı kurulamadı:', e));
    });
  }
</script>
</body>
</html>
